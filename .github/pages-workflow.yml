# ---------------------------------------------------------------------------------------
# THIS FILE BELONGS AT .github/workflows/pages.yml — nothing deploys until it is moved:
#
#     git mv .github/pages-workflow.yml .github/workflows/pages.yml
#
# It is parked here because GitHub refuses a push that touches .github/workflows/ from a
# token without the `workflow` scope, which the session that wrote it did not have. A push
# from a normal checkout is fine.
# ---------------------------------------------------------------------------------------

name: Pages

# Every push rebuilds the whole site, because a Pages deployment replaces it wholesale:
# the default branch at the root, every other branch under branches/<name>/. That makes
# the site a pure function of the repo's branches — a deleted branch loses its preview on
# the next run, which is what the `delete` trigger is for.
on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments must not interleave, and cancelling one would leave the site mid-rewrite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every branch, not just the pushed one

      - name: Assemble the site
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/build-pages.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
